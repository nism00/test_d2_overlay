<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', sans-serif; }
        html, body { background: transparent; color: #e6edf3; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 7px 12px; }
        .hero-name { font-weight: 700; font-size: 13px; color: #f0f6fc; }
        .controls { padding: 7px 12px; display: flex; justify-content: space-between; align-items: center; }
        select { background: #1c232e; color: #e6edf3; border: none; border-radius: 5px; padding: 3px 6px; font-size: 11px; outline: none; }
        .clock { font-size: 12px; font-weight: 600; color: #8b949e; }
        .table-wrap { padding: 6px 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        td { padding: 5px 6px; text-align: right; font-weight: 700; }
        td:first-child { text-align: left; color: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        tr.head td { color: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .gold-text { color: #ffd700; }
        .target-text { color: #2ecc71; }
    </style>
</head>
<body>
<div class="header">
    <span class="hero-name" id="heroName">Ожидание Dota 2...</span>
</div>
<div class="controls">
    <div>
        <span style="font-size: 11px; color: #8b949e; margin-right: 4px;">Роль:</span>
        <select id="roleSelect" onchange="updateData()">
            <option value="all">Любая (Общий)</option>
            <option value="carry">Керри (Safe)</option>
            <option value="mid">Мид (Mid)</option>
            <option value="offlane">Оффлейн (Off)</option>
            <option value="support">Саппорт</option>
        </select>
    </div>
    <span class="clock" id="clockText">00:00</span>
</div>
<div class="table-wrap">
    <table>
        <tr class="head">
            <td>Показатели</td>
            <td>Сейчас</td>
            <td>Цель</td>
        </tr>
        <tr>
            <td>GPM</td>
            <td id="curGpm">0</td>
            <td class="target-text" id="targetGpm">—</td>
        </tr>
        <tr>
            <td>Gold</td>
            <td class="gold-text" id="curNw">0</td>
            <td class="target-text" id="targetNw">—</td>
        </tr>
    </table>
</div>

<script>
    function fmt(num) {
        return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }
    function formatTime(sec) {
        const sign = sec < 0 ? "-" : "";
        const abs = Math.abs(Math.floor(sec));
        return sign + String(Math.floor(abs / 60)).padStart(2, "0") + ":" + String(abs % 60).padStart(2, "0");
    }
    async function updateData() {
        const role = document.getElementById("roleSelect").value;
        const resp = await fetch("http://localhost:3000/api/state?role=" + role);
        const data = await resp.json();

        document.getElementById("heroName").textContent = data.hero_name;
        document.getElementById("clockText").textContent = formatTime(data.clock_time);
        document.getElementById("curGpm").textContent = data.gpm;
        document.getElementById("curNw").textContent = fmt(data.total_gold);

        if (data.has_data && data.target_gpm > 0) {
            document.getElementById("targetGpm").textContent = data.target_gpm;
        }
        if (data.has_data && data.target_gold > 0) {
            document.getElementById("targetNw").textContent = fmt(data.target_gold);
        }
    }
    function cycleRole() {
        const sel = document.getElementById("roleSelect");
        sel.selectedIndex = (sel.selectedIndex + 1) % sel.options.length;
        updateData();
    }
    setInterval(updateData, 10000);
    updateData();
</script>
</body>
</html>
